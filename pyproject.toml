[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "composer-agent"
version = "0.2.0"
description = "Thread-based agents with typed streaming, tool-hide rules, branch compression, and optional Django persistence"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "MM21B038", email = "mg2464109@gmail.com" },
]
keywords = ["langchain", "agents", "llm", "mcp", "streaming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "deepagents>=0.6.3",
    "langchain>=1.3.1",
    "langchain-core>=1.4.0",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-openai>=1.2.1",
    "langchain-openrouter>=0.2.3",
    "langgraph>=1.2.0",
    "numpy>=2.0.0",
    "pillow>=11.0.0",
    "tiktoken>=0.13.0",
]

[project.optional-dependencies]
django = ["django>=5.1"]
dev = [
    "build>=1.2",
    "django>=5.1",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "pytest>=8.0",
    "pytest-django>=4.9",
    "python-dotenv>=1.0.0",
    "twine>=6.0",
]
all = [
    "django>=5.1",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "pytest>=8.0",
    "pytest-django>=4.9",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/MM21B038/composer"
Documentation = "https://github.com/MM21B038/composer/blob/main/docs/chat_persistence.md"
Repository = "https://github.com/MM21B038/composer"
Issues = "https://github.com/MM21B038/composer/issues"

[project.scripts]
composer-migrate = "composer.persistence.cli:migrate"

[tool.hatch.build]
exclude = [
    "**/.ipynb_checkpoints",
    "**/__pycache__",
]

[tool.hatch.build.targets.wheel]
packages = ["composer", "chat", "composer_site"]

[tool.hatch.build.targets.sdist]
include = [
    "/composer",
    "/chat",
    "/composer_site",
    "/docs",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "composer_site.settings"
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "build>=1.2",
    "django>=5.1",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "pytest>=8.0",
    "pytest-django>=4.9",
    "python-dotenv>=1.0.0",
    "twine>=6.0",
]
